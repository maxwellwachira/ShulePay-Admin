name: Release

# Push a tag matching the version in package.json (e.g. v0.1.0) to build the
# Windows installer and publish it — plus latest.yml for auto-update — to a
# GitHub Release. electron-builder creates the release if it doesn't exist yet.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
